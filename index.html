    <meta property="og:title" content="CampGear POS - Kasir Sewa Alat Gunung & Inventori" />
    <meta property="og:description" content="Aplikasi kasir sewa peralatan gunung outdoor dengan manajemen inventaris barang, pelacakan nota denda/keterlambatan, dan sistem pembayaran digital QRIS." />

    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    </noscript>
    <script>
      // Cleanly suppress benign Vite HMR websocket disconnection notices without breaking WebSocket constructor
      (function() {
        const origConsoleError = console.error;
        const origConsoleWarn = console.warn;
        console.error = function(...args) {
          const str = args.map(a => (a && a.stack) ? a.stack : String(a)).join(' ');
          if (str.includes('WebSocket') || str.includes('closed without opened') || str.includes('@vite/client') || str.includes('[vite]')) {
            return;
          }
          origConsoleError.apply(console, args);
        };
        console.warn = function(...args) {
          const str = args.map(a => String(a)).join(' ');
          if (str.includes('WebSocket') || str.includes('closed without opened') || str.includes('@vite/client')) {
            return;
          }
          origConsoleWarn.apply(console, args);
        };
      })();

      window.addEventListener('unhandledrejection', function (e) {
        const str = String(e.reason?.message || e.reason || '');
        if (str.includes('WebSocket') || str.includes('closed without opened')) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('error', function (e) {
        const str = String(e.message || e.error?.message || '');
        if (str.includes('WebSocket') || str.includes('closed without opened') || str.includes('@vite/client') || str.includes('[vite]')) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
    </script>
  </head>
  <body class="bg-slate-100 text-slate-800 antialiased font-sans w-full max-w-full overflow-x-hidden min-h-screen">
    <div id="root" class="w-full max-w-full min-h-screen flex flex-col">
      <!-- Instant Lightweight Loading Splash (replaces blank white screen in <50ms) -->
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #f8fafc; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <div style="width: 58px; height: 58px; border-radius: 18px; background: linear-gradient(135deg, #1d4ed8, #3b82f6); display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 24px -6px rgba(37, 99, 235, 0.35); margin-bottom: 16px;">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="m8 3 4 8 5-5 5 15H2L8 3z"/>
          </svg>
        </div>
        <div style="font-size: 18px; font-weight: 800; color: #0f172a; letter-spacing: -0.02em; margin-bottom: 4px;">
          CampGear POS
        </div>
        <div style="font-size: 12px; font-weight: 600; color: #64748b; margin-bottom: 22px;">
          Memuat data kasir & inventori...
        </div>
        <div style="width: 140px; height: 4px; background: #e2e8f0; border-radius: 999px; overflow: hidden; position: relative;">
          <div style="width: 45%; height: 100%; background: #2563eb; border-radius: 999px; animation: campgear-loading 1.1s infinite ease-in-out;"></div>
        </div>
        <style>
          @keyframes campgear-loading {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(260%); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
