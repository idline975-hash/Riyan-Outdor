    <script>
      // Aggressively suppress benign Vite HMR websocket disconnection notices
      (function() {
        const origConsoleError = console.error;
        const origConsoleWarn = console.warn;
        console.error = function(...args) {
          const str = args.map(a => (a && a.stack) ? a.stack : String(a)).join(' ');
          if (str.includes('WebSocket') || str.includes('closed without opened') || str.includes('@vite/client') || str.includes('[vite]')) {
            return;
          }
          origConsoleError.apply(console, args);
        };
        console.warn = function(...args) {
          const str = args.map(a => String(a)).join(' ');
          if (str.includes('WebSocket') || str.includes('closed without opened') || str.includes('@vite/client')) {
            return;
          }
          origConsoleWarn.apply(console, args);
        };
      })();

      // Global WebSocket override to prevent connection attempts in restricted environments
      window.WebSocket = function() {
        console.log('WebSocket blocked by applet suppression');
        return {
          send: () => {},
          close: () => {},
          readyState: 3, // CLOSED
          addEventListener: () => {},
        };
      };

      window.addEventListener('unhandledrejection', function (e) {
        const str = String(e.reason?.message || e.reason || '');
        if (str.includes('WebSocket') || str.includes('closed without opened')) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('error', function (e) {
        const str = String(e.message || e.error?.message || '');
        if (str.includes('WebSocket') || str.includes('closed without opened') || str.includes('@vite/client') || str.includes('[vite]')) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
    </script>

    <script type="module" src="/src/main.tsx"></script>
